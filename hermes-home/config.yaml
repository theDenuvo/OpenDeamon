# OpenDeamon — Hermes configuration (managed by free-rank).
# OPENROUTER_API_KEY via environment, never stored here.
model:
  provider: openrouter
  # Core switched from super to ultra on the measurement in TODO phase 2-ter:
  # super median 7.16 s (spread 3.16-10.21, x3), ultra median 0.82 s
  # (0.79-1.03). Rule from the same section: median over 5 runs, and two
  # attempts before declaring a model dead (a dead endpoint holds the
  # connection 75-81 s).
  default: nvidia/nemotron-3-ultra-550b-a55b:free
fallback_providers:
  - provider: openrouter
    model: inclusionai/ling-3.0-flash-sante:free
  - provider: openrouter
    model: nvidia/nemotron-3-super-120b-a12b:free
  - provider: openrouter
    model: nvidia/nemotron-3.5-lightning:free
auxiliary:
  # --- $0 rail for background traffic (TODO phase 2.1) ---
  # free_only: the auto-chain's OpenRouter step is skipped unless the
  # fallback model ends in ":free", so a PAID lane is unreachable for aux
  # calls even with OPENROUTER_API_KEY set. The default is False, and the
  # default openrouter_model below is google/gemini-3.6-flash - PAID - with
  # only a WARNING when it engages. Warning is not a control.
  free_only: true
  # Pinned to the free SKU explicitly rather than left to the auto-chain.
  openrouter_model: "nvidia/nemotron-3-ultra-550b-a55b:free"
  # Measured 2026-09-30 in state.db session_model_usage:
  #   title_generation   52 calls   (vs 90 main-turn calls)
  #   background_review   7 calls
  # Neither affects answer quality. Both are pure overhead on a 1000/day
  # bucket. Disabled rather than left on by default.
  title_generation:
    enabled: false
  background_review:
    enabled: false
  # Layer 0, item 8. The plan names Groq via `provider: custom` as the
  # reviewer, with NIM as fallback. Implemented on NIM instead, for two
  # reasons measured live 2026-09-30:
  #   1. Groq answers HTTP 403 "Forbidden" from this machine's exit while
  #      OpenRouter and NIM both answer 200 from the same VPN session - so
  #      VPN is up and the block is Groq-side (the gateway.env note records
  #      the same: ASN Interhive 403, other exits 200).
  #   2. Hermes has no `groq` provider at all; `custom` would need the key
  #      written into this config, and config.yaml is git-tracked. A secret
  #      in the repo is not an acceptable way to make a reviewer work.
  # NIM keeps the independence SCHEME requires: core is OpenRouter, reviewer
  # is NIM, so FULL (different provider AND different model), not SEVERE.
  # Reported to the planner as INFRA_FAILURE on the Groq rail.
  review:
    provider: nvidia
    model: openai/gpt-oss-20b
    fallback_chain:
      - provider: openrouter
        model: inclusionai/ling-3.0-flash-sante:free
  vision:
    provider: openrouter
    model: dots-studio/dots-3-note-preview:free
    fallback_chain:
      - provider: openrouter
        model: qwen/qwen3.8-27b:free
      - provider: openrouter
        model: google/gemma-4-31b-it:free
skills:
  external_dirs:
    - A:/OpenDeamon/functions
delegation:
  # All delegated children on NIM (layer 0, items 6-7).
  provider: nvidia
  model: openai/gpt-oss-20b
  # A child pinned by provider/model inherits NO fallback unless this is
  # declared explicitly (delegate_tool_config.py:471-485) — so without these
  # lines NIM children would have no chain at all.
  fallback_providers:
    - provider: nvidia
      model: nvidia/nemotron-3-super-120b-a12b
    - provider: openrouter
      model: inclusionai/ling-3.0-flash-sante:free
timezone: ''
# Layer 0, item 4: the framework will not accept a final answer after code
# edits without fresh verification evidence.
verify_on_stop: "auto"
max_verify_nudges: 3
# Layer 0, item 5: shadow git-store. Layer 2 hashes baseline tests into a
# LEDGER and layer 4 commits verified work here, so the reviewer reads a commit
# rather than a live tree (TOCTOU). max_snapshots is the hard ceiling on total
# snapshots; layer 4 notes it is tight at 20 tasks/day and that room for the
# verified commit must be reserved explicitly.
checkpoints:
  enabled: true
  max_snapshots: 20
display:
  message_reactions: true
  pet:
    enabled: true
    slug: 'roubao'
    scale: 0.3
_config_version: 46
moa:
  # KEEP THIS BLOCK. Do not delete it to "disable MoA".
  #
  # Deleting `moa:` does NOT disable MoA - it re-exposes Hermes' built-in
  # default preset from hermes_cli/config_defaults.py:1408-1416, whose
  # reference models are openai-codex/gpt-5.5 and openrouter/deepseek-v4-pro
  # with an anthropic/claude-opus-4.8 aggregator. All three are PAID. That
  # would turn a $0 project into a $0-violation on the next /moa.
  #
  # normalize_moa_config() (hermes_cli/moa_config.py:249) only falls back to
  # that preset when this one is absent, so this block is the safety interlock.
  #
  # `enabled: false` on the preset is what actually neutralises it: per
  # agent/moa_loop.py:1343-1346 "a disabled preset = use the aggregator
  # directly", so /moa costs 1 free call instead of fanning out to 3. No
  # fan-out, no surprise 3x spend, no paid model reachable.
  presets:
    default:
      enabled: false
      reference_models:
        - provider: openrouter
          model: nvidia/nemotron-3-ultra-550b-a55b:free
          enabled: true
        - provider: openrouter
          model: nvidia/nemotron-3-super-120b-a12b:free
          enabled: true
      degraded_reference_policy: loud
      fanout: user_turn
      # provider is REQUIRED here. Without it _clean_slot() returns None and
      # _normalize_preset() falls back to DEFAULT_MOA_AGGREGATOR, which is
      # anthropic/claude-opus-4.8 - PAID. The preset had `aggregator.model`
      # with no `provider` between 2026-09-29 and now, so /moa was silently
      # billing a paid aggregator on a $0 project. Verified by normalizing
      # the config and reading the resolved slot.
      aggregator:
        provider: openrouter
        model: nvidia/nemotron-3.5-lightning:free
  # The old flat duplicate keys (reference_models/aggregator/enabled) were dead
  # weight: normalize_moa_config only reads the flat form when `presets` is
  # empty, and it rebuilds a flattened view from the preset anyway. They also
  # carried a nano-omni entry - the model that 404s on images - so leaving them
  # was a second trap for anyone who later deleted `presets:`.
approvals:
  mode: "off"
  cron_mode: auto
  single_query_mode: auto
  unattended_mode: auto
  mcp_reload_confirm: false
  destructive_slash_confirm: false
web:
  search_backend: searxng
hooks:
  pre_tool_call:
    - matcher: "terminal|write_file|patch|edit|code_execution|execute_code|delegate_task"
      prompt: "delegate-first: code tools are blocked on purpose. Hand coding to the opencode CLI worker with one 'opencode run -m opencode/space-bunny-free ...' terminal call, then verify by running the tests."
      command: "py -u A:/OpenDeamon/functions/delegate-first/pre_tool_budget.py"
      timeout: 10
    # NO matcher key on purpose. An absent matcher means "fire on every tool"
    # (agent/shell_hooks.py: matcher.strip() or None -> matches_tool returns
    # True). The previous value was matcher: "*", which fails re.compile()
    # ("nothing to repeat at position 0"), falls back to literal equality, and
    # then matches only a tool literally named "*" - i.e. this hook never ran.
    # Verified in hermes-home/logs/errors.log on 2026-09-30 15:03.
    - prompt: "quota-watch: OpenRouter spend/daily-free limits are enforced by this hook. If it reports a QUOTA WARNING or STOP, switch to the opencode-free ladder or local functions."
      command: "py -u A:/OpenDeamon/functions/quota-watch/quota_watch.py"
      timeout: 20
hooks_auto_accept: true
