# OpenDeamon — Hermes configuration (managed by free-rank).
# OPENROUTER_API_KEY via environment, never stored here.
model:
  provider: openrouter
  # Core switched from super to ultra on the measurement in TODO phase 2-ter:
  # super median 7.16 s (spread 3.16-10.21, x3), ultra median 0.82 s
  # (0.79-1.03). Rule from the same section: median over 5 runs, and two
  # attempts before declaring a model dead (a dead endpoint holds the
  # connection 75-81 s).
  default: nvidia/nemotron-3-ultra-550b-a55b:free
fallback_providers:
  - provider: openrouter
    model: inclusionai/ling-3.0-flash-sante:free
  - provider: openrouter
    model: nvidia/nemotron-3-super-120b-a12b:free
  - provider: openrouter
    model: nvidia/nemotron-3.5-lightning:free
auxiliary:
  # --- $0 rail for background traffic (TODO phase 2.1) ---
  # free_only: the auto-chain's OpenRouter step is skipped unless the
  # fallback model ends in ":free", so a PAID lane is unreachable for aux
  # calls even with OPENROUTER_API_KEY set. The default is False, and the
  # default openrouter_model below is google/gemini-3.6-flash - PAID - with
  # only a WARNING when it engages. Warning is not a control.
  free_only: true
  # Pinned to the free SKU explicitly rather than left to the auto-chain.
  openrouter_model: "nvidia/nemotron-3-ultra-550b-a55b:free"
  # Measured 2026-09-30 in state.db session_model_usage:
  #   title_generation   52 calls   (vs 90 main-turn calls)
  #   background_review   7 calls
  # Neither affects answer quality. Both are pure overhead on a 1000/day
  # bucket. Disabled rather than left on by default.
  title_generation:
    enabled: false
  background_review:
    enabled: false
  # Layer 0, item 8, revised after the planner rejected the NIM-only choice.
  #
  # The planner measured that Groq is reachable from this same egress
  # (GET /v1/models 200 in 0.79 s, POST /v1/chat/completions 200 in 0.56 s) and
  # that the earlier 403 was intermittent rather than ASN-bound. Their
  # reviewer benchmarks also put Groq 4-10x faster than NIM on real diffs.
  #
  # I confirmed in the Hermes source that a `custom` fallback_chain element
  # really does accept base_url and an API key: _try_configured_fallback_chain
  # documents "each needs provider; model/base_url/api_key optional", and
  # _resolve_fallback_entry passes explicit_base_url=entry["base_url"] plus
  # explicit_api_key=resolve_entry_api_key(entry).
  #
  # One deliberate difference from the planner's snippet: the key is given as
  # `key_env`, not `api_key: ${env:GROQ_API_KEY}`. resolve_entry_api_key accepts
  # both, but key_env reads through agent.secret_scope.get_secret, which is
  # profile-scoped and therefore correct under a multiplexed gateway, and the
  # secret never lands in this git-tracked file even transiently.
  #
  # Independence: core is OpenRouter, the primary reviewer is NIM, and Groq is
  # a third provider - so any single reviewer choice keeps FULL. The last entry
  # is the core's own provider, which is PARTIAL; layer 6 is required to mark
  # that rather than let it pass silently.
  review:
    provider: nvidia
    model: openai/gpt-oss-20b
    fallback_chain:
      - provider: custom
        base_url: https://api.groq.com/openai/v1
        model: openai/gpt-oss-120b
        key_env: GROQ_API_KEY
      - provider: openrouter
        # PARTIAL, и теперь это помечается автоматически: элемент ведёт на
        # провайдера ЯДРА, поэтому подстановка в рантайме тихо ослабляет
        # независимость. Проверка:
        #   python functions/verdict/verdict.py routes \
        #     --config hermes-home/config.yaml --core-provider openrouter
        # Оставлен как последний резерв: два других рельса (NIM, Groq) -
        # независимые провайдеры, но если упадут все, пусть лучше PARTIAL с
        # пометкой, чем «нет вердикта».
        model: inclusionai/ling-3.0-flash-sante:free
  # Phase 6.4: local vision is wired. The plugin model-providers/ollama-cloud
  # only reaches https://ollama.com/v1 and cannot be pointed at 127.0.0.1, so
  # this goes through `custom`, which is already Ollama-aware (the ollama/vllm/
  # llamacpp aliases, the 11434 port probe for think:false, ollama_num_ctx).
  # /v1 is required - it is the OpenAI-compatible surface, not the native /api.
  #
  # Measured, not assumed. The first live attempt answered with EMPTY content
  # at max_tokens=300 and `completion_tokens: 300` - the model spent the whole
  # budget reasoning, which is the same trap the reviewer layer guards against,
  # and the HTTP code was 200. Local models obey the same rule: max_tokens must
  # clear the reasoning overhead.
  #
  # A second trap: the OpenAI-compatible shape is content as an array with an
  # image_url data URI. Sending the native {"images": [base64]} silently drops
  # the picture - prompt_tokens stayed at 41 and the model described a "red
  # circle" for a blue rectangle. A non-empty answer is not proof it saw the
  # image; functions/local-vision/ checks against a picture whose answer is
  # known.
  vision:
    provider: custom
    model: "qwen3-vl:8b"
    base_url: "http://127.0.0.1:11434/v1"
    api_key: "no-key"
    timeout: 120
    fallback_chain:
      - provider: openrouter
        model: dots-studio/dots-3-note-preview:free
skills:
  external_dirs:
    - A:/OpenDeamon/functions
delegation:
  # All delegated children on NIM (layer 0, items 6-7).
  provider: nvidia
  model: openai/gpt-oss-20b
  # A child pinned by provider/model inherits NO fallback unless this is
  # declared explicitly (delegate_tool_config.py:471-485) — so without these
  # lines NIM children would have no chain at all.
  fallback_providers:
    - provider: nvidia
      model: nvidia/nemotron-3-super-120b-a12b
    - provider: openrouter
      model: inclusionai/ling-3.0-flash-sante:free
timezone: ''
# Layer 0, item 4: the framework will not accept a final answer after code
# edits without fresh verification evidence.
verify_on_stop: "auto"
max_verify_nudges: 3
# Layer 0, item 5: shadow git-store. Layer 2 hashes baseline tests into a
# LEDGER and layer 4 commits verified work here, so the reviewer reads a commit
# rather than a live tree (TOCTOU). max_snapshots is the hard ceiling on total
# snapshots; layer 4 notes it is tight at 20 tasks/day and that room for the
# verified commit must be reserved explicitly.
checkpoints:
  enabled: true
  max_snapshots: 20

# Phase 5.2 - computer_use. The load-bearing fact: UI control does NOT require
# vision from the core model. The core here is text-only (nemotron-3-ultra), so
# the capture mode is `ax`: accessibility tree, zero pixels. The default `som`
# ships a screenshot to a model that cannot read it - a hard 400/404, plus one
# extra aux-vision call per element.
#
# Works without vision: list_windows, focus_app, wait, capture(mode=ax), every
# action addressed by element: N, and the keyboard. Only reading what is
# DRAWN needs vision: canvas, video, scrollbars.
#
# Doctor verified 2026-10-02: cua-driver 0.28.2 on win32, MCP session active,
# UIAutomation reachable (so the UIPI integrity problem does not bite here),
# D3D11 device reachable for Windows Graphics Capture.
computer_use:
  capture_after_mode: ax
  ax_max_elements: 200
  # A screenshot is still how canvas/video/scrollbars get read, and that goes
  # through aux vision rather than through the core.
  max_image_dimension: 1456
  cua_telemetry: false

display:
  message_reactions: true
  pet:
    enabled: true
    slug: 'roubao'
    scale: 0.3
_config_version: 46
moa:
  # KEEP THIS BLOCK. Do not delete it to "disable MoA".
  #
  # Deleting `moa:` does NOT disable MoA - it re-exposes Hermes' built-in
  # default preset from hermes_cli/config_defaults.py:1408-1416, whose
  # reference models are openai-codex/gpt-5.5 and openrouter/deepseek-v4-pro
  # with an anthropic/claude-opus-4.8 aggregator. All three are PAID. That
  # would turn a $0 project into a $0-violation on the next /moa.
  #
  # normalize_moa_config() (hermes_cli/moa_config.py:249) only falls back to
  # that preset when this one is absent, so this block is the safety interlock.
  #
  # `enabled: false` on the preset is what actually neutralises it: per
  # agent/moa_loop.py:1343-1346 "a disabled preset = use the aggregator
  # directly", so /moa costs 1 free call instead of fanning out to 3. No
  # fan-out, no surprise 3x spend, no paid model reachable.
  presets:
    default:
      enabled: false
      reference_models:
        - provider: openrouter
          model: nvidia/nemotron-3-ultra-550b-a55b:free
          enabled: true
        - provider: openrouter
          model: nvidia/nemotron-3-super-120b-a12b:free
          enabled: true
      degraded_reference_policy: loud
      fanout: user_turn
      # provider is REQUIRED here. Without it _clean_slot() returns None and
      # _normalize_preset() falls back to DEFAULT_MOA_AGGREGATOR, which is
      # anthropic/claude-opus-4.8 - PAID. The preset had `aggregator.model`
      # with no `provider` between 2026-09-29 and now, so /moa was silently
      # billing a paid aggregator on a $0 project. Verified by normalizing
      # the config and reading the resolved slot.
      aggregator:
        provider: openrouter
        model: nvidia/nemotron-3.5-lightning:free
  # The old flat duplicate keys (reference_models/aggregator/enabled) were dead
  # weight: normalize_moa_config only reads the flat form when `presets` is
  # empty, and it rebuilds a flattened view from the preset anyway. They also
  # carried a nano-omni entry - the model that 404s on images - so leaving them
  # was a second trap for anyone who later deleted `presets:`.
approvals:
  mode: "off"
  cron_mode: auto
  single_query_mode: auto
  unattended_mode: auto
  mcp_reload_confirm: false
  destructive_slash_confirm: false
web:
  search_backend: searxng
hooks:
  pre_tool_call:
    - matcher: "terminal|write_file|patch|edit|code_execution|execute_code|delegate_task"
      prompt: "delegate-first: code tools are blocked on purpose. Hand coding to the
        opencode CLI worker with one 'opencode run -m opencode/space-bunny-free ...'
        terminal call, then verify by running the tests."
      command: "py -u A:/OpenDeamon/functions/delegate-first/pre_tool_budget.py"
      timeout: 10
    # NO matcher key on purpose. An absent matcher means "fire on every tool"
    # (agent/shell_hooks.py: matcher.strip() or None -> matches_tool returns
    # True). The previous value was matcher: "*", which fails re.compile()
    # ("nothing to repeat at position 0"), falls back to literal equality, and
    # then matches only a tool literally named "*" - i.e. this hook never ran.
    # Verified in hermes-home/logs/errors.log on 2026-09-30 15:03.
    - prompt: "quota-watch: OpenRouter spend/daily-free limits are enforced by this
        hook. If it reports a QUOTA WARNING or STOP, switch to the opencode-free ladder
        or local functions."
      command: "py -u A:/OpenDeamon/functions/quota-watch/quota_watch.py"
      timeout: 20
hooks_auto_accept: true
mcp_servers:
  context7:
    url: https://mcp.context7.com/mcp
    enabled: true
  deepwiki:
    url: https://mcp.deepwiki.com/mcp
    enabled: true
  aws-knowledge:
    url: https://knowledge-mcp.global.api.aws
    enabled: true
    tools:
      exclude:
        - aws___retrieve_skill
  microsoft-learn:
    url: https://learn.microsoft.com/api/mcp
    enabled: true
  twilio-docs:
    url: https://mcp.twilio.com/docs
    enabled: true
  wolfram:
    url: https://agenttools.wolfram.com/mcp
    enabled: true
  kiwi:
    url: https://mcp.kiwi.com
    enabled: true
    tools:
      include:
        - search-flight
  trivago:
    url: https://mcp.trivago.com/mcp
    enabled: true
