version: '3.8'

services:
  searxng:
    image: searxng/searxng:latest
    container_name: searxng
    restart: unless-stopped
    # Публикуем порт на петлю хоста: снаружи поисковик не должен быть виден
    # ни в какой сети. Порт 8080 внутри контейнера - стандартный для образа.
    ports:
      - "127.0.0.1:8888:8080"
    volumes:
      - ./searxng:/etc/searxng:rw
      - searxng-cache:/var/cache/searxng:rw
    environment:
      - SEARXNG_BASE_URL=http://localhost:8888/
      - SEARXNG_SECRET=${SEARXNG_SECRET}
    # РАЗНИЦА С ПРЯМЫМ ЗАПУСКОМ, И ОНА НЕ КОСМЕТИЧЕСКАЯ.
    #
    # В settings.yml теперь `bind_address: 127.0.0.1`, потому что при запуске
    # на машине напрямую слушать все интерфейсы нельзя: аутентификации у
    # поисковика нет, и открытый эндпоинт читает кто угодно из сети.
    #
    # Внутри контейнера так нельзя: там своё сетевое пространство, и
    # 127.0.0.1 - это петля самого контейнера, до которой не доходит
    # опубликованный порт. Поэтому compose подменяет настройки файлом
    # ./searxng/docker/settings.yml: процесс слушает 0.0.0.0 ВНУТРИ
    # контейнера, а снаружи порт по-прежнему закрыт петлёй хоста выше.
    # Эндпоинт недоступен извне в обоих случаях - различается только то,
    # какими средствами это достигнуто.
    #
    # Если забыть подмену, docker-compose поднимет контейнер, который
    # слушает во внутренней петле, и порт будет молча мёртвым.
    command:
      - sh
      - -c
      - "cp /etc/searxng/docker/settings.yml /etc/searxng/settings.yml && exec searxng-run"
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
      - DAC_OVERRIDE
    logging:
      driver: "json-file"
      options:
        max-size: "1m"
        max-file: "1"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  valkey:
    image: valkey/valkey:8-alpine
    container_name: searxng-valkey
    restart: unless-stopped
    command: ["valkey-server", "--save", "", "--appendonly", "no", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - valkey-data:/data
    cap_drop:
      - ALL
    cap_add:
      - SETGID
      - SETUID
      - DAC_OVERRIDE
    logging:
      driver: "json-file"
      options:
        max-size: "1m"
        max-file: "1"

volumes:
  searxng-cache:
  valkey-data: