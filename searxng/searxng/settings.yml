# SearXNG Configuration — optimized for quality search with Hermes
# Read the full docs: https://docs.searxng.org/admin/settings/

use_default_settings: true

# ── Instance identity ──────────────────────────────────────────
general:
  instance_name: "Hermes Search"
  debug: false
  privacypolicy_url: false
  contact_url: false
  enable_metrics: false
  strict_host_token: true

# ── Server ─────────────────────────────────────────────────────
server:
  # СЕКРЕТА ЗДЕСЬ НЕТ, И ЭТО НЕ ОПЕЧАТКА.
  # Раньше в этой строке лежал 64-символьный ключ, уехавший в git вместе с
  # репозиторием, а репозиторий публичный. Ключ подписан именем сессии,
  # поэтому любая выданная по нему сессия выдавалась заново.
  #
  # Теперь ключ приходит из переменной окружения SEARXNG_SECRET, и SearXNG
  # отдаёт ей приоритет над значением из файла (searx/settings_defaults.py:
  # SettingsValue(environ_name='SEARXNG_SECRET')). Пока переменная не задана,
  # действует заглушка ниже - а её SearXNG отказывается принимать в рабочем
  # режиме (searx/webapp.py проверяет 'ultrasecretkey'), поэтому забытый
  # секрет падает громко, а не молча обслуживает чужие запросы.
  secret_key: "unset-provide-SEARXNG_SECRET"
  # Только петля. Раньше стояло 0.0.0.0: под docker это не выглядело
  # проблемой (compose публиковал порт на 127.0.0.1), но сам процесс слушал
  # все интерфейсы, и любая другая публикация порта - или запуск вообще без
  # compose - сразу отдавала открытый поисковик наружу. Поиску доступ извне
  # не нужен, поэтому 0.0.0.0 здесь не давал ничего, кроме риска.
  bind_address: "127.0.0.1"
  port: 8888
  base_url: "http://127.0.0.1:8888/"
  image_proxy: true
  http_protocol_version: "1.1"
  method: "POST"
  limiter: false
  public_instance: false

# ── Redis/Valkey for limiter & cache ───────────────────────────
redis:
  url: "redis://valkey:6379/0"

# ── Outgoing requests ──────────────────────────────────────────
outgoing:
  request_timeout: 5.0
  max_request_timeout: 15.0
  pool_connections: 100
  pool_maxsize: 20
  useragent_suffix: "hermes@localhost"

# ── Search behavior ────────────────────────────────────────────
search:
  safe_search: 0          # 0=off, 1=moderate, 2=strict
  autocomplete: ""        # empty = off (privacy); set to "google" if you want
  default_lang: "ru"      # Hermes user's language
  formats:
    - html
    - json                # required for Hermes API
  request_delay: 1.5      # polite delay between upstream queries
  ban_time_on_fail: 60    # ban engine 60s on failure
  max_ban_time_on_fail: 300

# ── Engines — quality over quantity ────────────────────────────
# Curated list: best coverage, least noise, most reliable
engines:
  # ── General web ──
  - name: brave
    engine: brave
    shortcut: brave
    disabled: false
    categories: [general]

  - name: startpage
    engine: startpage
    shortcut: sp
    disabled: false
    categories: [general]

  - name: duckduckgo
    engine: duckduckgo
    shortcut: ddg
    disabled: false
    categories: [general]

  - name: wikipedia
    engine: wikipedia
    shortcut: wp
    disabled: false
    categories: [general]
    language: ru

  - name: bing
    engine: bing
    shortcut: bing
    disabled: false
    categories: [general]

  # ── Code & dev ──
  - name: github
    engine: github
    shortcut: gh
    disabled: false
    categories: [code]

  - name: stackoverflow
    engine: stackoverflow
    shortcut: so
    disabled: false
    categories: [code]

  # ── Science & papers ──
  - name: arxiv
    engine: arxiv
    shortcut: arxiv
    disabled: false
    categories: [science]

  - name: pubmed
    engine: pubmed
    shortcut: pubmed
    disabled: false
    categories: [science]

  # ── Disabled: noisy or unreliable ──
  - name: yahoo
    disabled: true
  - name: yandex
    disabled: true
  - name: qwant
    disabled: true
  - name: mojeek
    disabled: true

# ── UI ─────────────────────────────────────────────────────────
ui:
  static_use_hash: true
  default_theme: simple
  default_theme_style: dark
  query_in_title: false
  infinite_scroll: false
  results_on_new_tab: false
  center_alignment: false

