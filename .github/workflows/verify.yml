name: verify

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  portable:
    name: portable suites (stdlib only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: install the one non-stdlib dependency
        run: python -m pip install --quiet "PyYAML==6.0.3"

      - name: portable suites
        # shell: bash + явный set +e ниже. shell нужен, чтобы поведение шага
        # не зависело от умолчания раннера, а не для красоты.
        shell: bash
        run: |
          set -uo pipefail

          # errexit ВЫКЛЮЧЁН намеренно, и это не небрежность.
          #
          # GitHub запускает тело шага как `bash -e {0}`: errexit уже включён,
          # и `set -uo pipefail` его не выключает - он лишь добавляет
          # pipefail и nounset. Далее в шаге есть строка
          #
          #     out=$(python "$f" 2>&1); rc=$?
          #
          # Она честно СОБИРАЕТ код возврата набора, чтобы шаг сам решил, что с
          # ним делать. Но под errexit первая же команда, вернувшая не ноль,
          # убивает шаг целиком - вместе с ней умирает и цикл, который должен
          # был собрать факты по всем наборам.
          #
          # Что из этого вышло в прогонах #26 и #28 (оба красные):
          #   functions/startup/test_startup.py возвращает 2 - объявленный
          #   пропуск «нулевой прогон это не успех» на любой не-Windows
          #   машине. Под errexit на нём шаг умер: exit code 2, а в
          #   observed.tsv лежало 13 фактов из 20.
          #   Следующий шаг, сверка, честно сообщил: семь наборов
          #   «did not run at all» - и упал с exit code 1.
          #
          # То есть оба красных сигнала на странице прогона - следствие одной
          # строки, а не семи разных дефектов. Шаг обязан ДОЙТИ до конца цикла:
          # его работа - собрать вердикт по каждому набору, а не оборваться на
          # первом неприятном коде.
          set +e

          fail=0

          # ЗАКОН «ноль проверок — не успех». Коды и список объявленных пропусков
          # берутся из functions/meta/zero_checks_law.py, а не из этого файла:
          # пока список был константой в shell, объявить пропуск значило
          # отредактировать шаг CI молча. Теперь шаг не знает ни одного имени
          # набора своим текстом.
          #
          #   0 PASS  проверки выполнялись   2 SKIP  проверок не было, пропуск объявлен
          #   1 FAIL  проверка провалилась  3 ENV   прогон не состоялся, и это НЕ объявлено
          declared_skip=$(PYTHONPATH=functions/meta \
            python functions/meta/zero_checks_law.py --declared-skips | tr '\n' ' ')
          summary="${GITHUB_STEP_SUMMARY:-/dev/null}"
          observed="${RUNNER_TEMP:-/tmp}/observed.tsv"
          # Метка старта прогона: сверка сверяет свежесть файла наблюдения по
          # ней, чтобы прогон прошлой ночи нельзя было выдать за сегодняшний.
          : > "${RUNNER_TEMP:-/tmp}/verify-run-start"
          : > "$observed"
          {
            echo "### verify: portable suites"
            echo
            echo "| suite | rc | ran | skipped | verdict |"
            echo "|---|---|---|---|---|"
          } >> "$summary"

          for f in functions/specgate/test_spec_gate.py \
                   functions/baseline/test_baseline.py \
                   functions/mechanical/test_mechanical.py \
                   functions/reviewer/test_reviewer.py \
                   functions/verdict/test_verdict.py \
                   functions/workerstate/test_worker_state.py \
                   functions/quota-watch/test_quota_watch.py \
                   functions/quota-watch/test_moa_free_rail.py \
                   functions/delegate-first/test_delegate_first.py \
                   functions/free-rank/test_vision_gate.py \
                   functions/mcp-policy/test_mcp_policy.py \
                   functions/routing-map/test_routing_map.py \
                   functions/hygiene/test_hygiene.py \
                   functions/startup/test_startup.py \
                   functions/reserve/test_reserve_not_activated.py \
                   functions/meta/test_coverage_manifest.py \
                   functions/meta/test_zero_checks_law.py \
                   functions/search/test_search.py \
                   functions/opencode-adapter/test_opencode_adapter.py \
                   functions/verification-matrix/test_verification_matrix.py ; do
            [ -f "$f" ] || { echo "MISSING $f"; fail=1; continue; }

            out=$(python "$f" 2>&1); rc=$?
            # Числа берём из машинночитаемой строки закона, когда она есть, и
            # только иначе считаем строки вывода. «VERIFY-RESULT» - контракт,
            # `^pass` - проза, которую можно испортить правкой формулировки.
            ran=$(printf '%s\n' "$out" | sed -n 's/^VERIFY-RESULT.*passed_ran=\([0-9]*\).*/\1/p' | head -1)
            [ -n "$ran" ] || ran=$(printf '%s\n' "$out" | grep -c '^pass' || true)
            skipped=$(printf '%s\n' "$out" | grep -c '^SKIP' || true)
            # Факт прогона уходит ДАННЫМИ: сверка с манифестом читает этот файл.
            printf '%s\t%s\t%s\t%s\n' "$f" "$rc" "$ran" "$skipped" >> "$observed"

            declared=0
            case " $declared_skip " in *" $f "*) declared=1 ;; esac

            # Вердикт спрашивает закон (functions/meta/zero_checks_law.py), а не
            # решает этот шаг сам. Условие в shell было бы второй копией
            # правила, а вторая копия правила рано или поздно разъезжается с
            # первой - и разъехавшаяся молчит.
            v=$(printf '%s %s %s\n' "$rc" "$ran" "$declared" \
              | PYTHONPATH=functions/meta python functions/meta/zero_checks_law.py --verdict)
            vlabel=${v%% *}
            vwhy=${v#"$vlabel"}

            if [ "$vlabel" = "FAIL" ]; then
              echo "FAIL  $(printf '%-52s' "$f") rc=$rc, $ran ran: $vwhy"
              # Аннотация GitHub видна на странице прогона БЕЗ входа в аккаунт,
              # тогда как лог шага требует входа. Раньше причина падения жила
              # только в логе, поэтому прогон был красным и необъяснимым: видно
              # было лишь «Process completed with exit code N».
              echo "::error title=$f::rc=$rc, выполнено $ran - $vwhy"
              printf '%s\n' "$out" | grep -E '^(FAIL|ENV|Traceback)' | head -5
              echo "| \`$f\` | $rc | $ran | $skipped | **FAIL** |" >> "$summary"
              fail=1
            elif [ "$vlabel" = "SKIP" ]; then
              echo "SKIP  $(printf '%-52s' "$f") rc=$rc, $skipped groups skipped ($vwhy)"
              printf '%s\n' "$out" | grep -E '^SKIP|^VERIFY-RESULT' | head -3
              echo "| \`$f\` | $rc | 0 | $skipped | SKIP (declared) |" >> "$summary"
            else
              note=""
              [ "$skipped" -gt 0 ] && note=" ($skipped skipped)"
              echo "PASS  $(printf '%-52s' "$f") $ran groups$note"
              [ "$skipped" -gt 0 ] && printf '%s\n' "$out" | grep -A1 '^SKIP' | head -4
              echo "| \`$f\` | 0 | $ran | $skipped | pass$note |" >> "$summary"
            fi
          done

          echo
          # Диагностика, когда логи недоступны: страница прогона на GitHub
          # показывает аннотацию «exit code N» и молчит, а логи требуют входа
          # в аккаунт. Полная таблица фактов в summary — единственное место,
          # где причина видна без входа.
          {
            echo
            echo "### факты прогона (полная таблица)"
            echo
            printf '%s\n' "набор | код возврата | выполнено | пропущено"
            while IFS=$'\t' read -r sf src sran ssk; do
              [ -n "${sf:-}" ] || continue
              printf '%s\n' "| \`$sf\` | $src | $sran | $ssk |"
            done < "$observed"
          } >> "$summary"

          {
            if [ "$fail" -eq 0 ]; then echo "**portable suites: passing**"
            else echo "**portable suites: FAILING** — причины в таблице выше и в логе шага"; fi
          } >> "$summary"
          exit $fail

      - name: coverage reconciliation
        if: always()
        run: |
          set -uo pipefail
          # Каждый шаг в CI — отдельный шелл, поэтому `summary` из шага наборов
          # здесь не существует. Объявляем заново, иначе первая же запись в
          # summary молча уходит в никуда (при `set -u` — с ошибкой).
          summary="${GITHUB_STEP_SUMMARY:-/dev/null}"
          # errexit выключен по той же причине, что и в шаге наборов: тело
          # шага принимает решения само и обязано до них дойти.
          set +e
          # Список запуска можно сократить, и сам шаг этого не заметит: набор,
          # которого нет в списке, просто не выполняется, а сборка остаётся
          # зелёной. Проверено до правки: список из трёх наборов давал exit=0,
          # и тот же список без workerstate (41 группа) давал тот же exit=0.
          #
          # Сверка с манифестом требует, чтобы каждый объявленный набор
          # выполнил не меньше ожидаемого числа групп. Политика лежит в данных
          # (functions/meta/coverage-manifest.json), поэтому «подвинуть порог»
          # - это правка данных в git, а не безобидная правка константы в
          # этом файле. `if: always()` - сверка обязана отработать и тогда,
          # когда прогоны уже упали: иначе падение маскирует регресс покрытия.
          # Файл наблюдения — это ЕДИНСТВЕННЫЙ источник фактов о прогоне, и он
          # может оказаться не тем, о котором думает сверка: шаг выше мог
          # упасть до его создания, или на машине остался файл прошлого
          # прогона. Именно это случилось при диагностике прогона #26: на
          # локальной машине путь был `/tmp/observed.tsv`, а `RUNNER_TEMP`
          # смотрел в другое место, и сверка честно сообщила «18 наборов не
          # выполнялись» — про прогон, которого не было.
          #
          # Поэтому перед сверкой проверяем: файл существует, он непуст, и он
          # свежее начала этого прогона. Иначе это ENV («прогона не было»),
          # а не «покрытие потеряно». Различать эти два состояния обязательно:
          # первое чинится повтором, второе — отсутствием набора в CI.
          observed="${RUNNER_TEMP:-/tmp}/observed.tsv"
          marker="${RUNNER_TEMP:-/tmp}/verify-run-start"
          if [ ! -f "$observed" ] || [ ! -s "$observed" ]; then
            echo "NO OBSERVED FILE: the suites step produced no run facts at"
            echo "\`$observed\` — treating as ENVIRONMENT, not as lost coverage."
            {
              echo "| \`$observed\` | — | — | — | **ENV: no run facts** |"
              echo "**portable suites: no run facts to reconcile**"
            } >> "$summary"
            exit 3
          fi
          if [ -f "$marker" ] && [ "$observed" -ot "$marker" ]; then
            echo "STALE OBSERVED FILE: \`$observed\` is older than this run"
            echo "($marker) — it describes a previous run. Treating as ENVIRONMENT."
            {
              echo "| \`$observed\` | — | — | — | **ENV: stale run facts** |"
              echo "**portable suites: stale run facts, not reconciled**"
            } >> "$summary"
            exit 3
          fi

          python functions/meta/test_coverage_manifest.py --reconcile "$observed"