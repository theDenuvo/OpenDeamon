name: verify

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  portable:
    name: portable suites (stdlib only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: install the one non-stdlib dependency
        run: python -m pip install --quiet "PyYAML==6.0.3"

      - name: portable suites
        run: |
          set -uo pipefail
          fail=0

          # ЗАКОН «ноль проверок — не успех». Коды и список объявленных пропусков
          # берутся из functions/meta/zero_checks_law.py, а не из этого файла:
          # пока список был константой в shell, объявить пропуск значило
          # отредактировать шаг CI молча. Теперь шаг не знает ни одного имени
          # набора своим текстом.
          #
          #   0 PASS  проверки выполнялись   2 SKIP  проверок не было, пропуск объявлен
          #   1 FAIL  проверка провалилась  3 ENV   прогон не состоялся, и это НЕ объявлено
          declared_skip=$(PYTHONPATH=functions/meta \
            python functions/meta/zero_checks_law.py --declared-skips | tr '\n' ' ')
          summary="${GITHUB_STEP_SUMMARY:-/dev/null}"
          observed="${RUNNER_TEMP:-/tmp}/observed.tsv"
          : > "$observed"
          {
            echo "### verify: portable suites"
            echo
            echo "| suite | rc | ran | skipped | verdict |"
            echo "|---|---|---|---|---|"
          } >> "$summary"

          for f in functions/specgate/test_spec_gate.py \
                   functions/baseline/test_baseline.py \
                   functions/mechanical/test_mechanical.py \
                   functions/reviewer/test_reviewer.py \
                   functions/verdict/test_verdict.py \
                   functions/workerstate/test_worker_state.py \
                   functions/quota-watch/test_quota_watch.py \
                   functions/quota-watch/test_moa_free_rail.py \
                   functions/delegate-first/test_delegate_first.py \
                   functions/free-rank/test_vision_gate.py \
                   functions/mcp-policy/test_mcp_policy.py \
                   functions/routing-map/test_routing_map.py \
                   functions/hygiene/test_hygiene.py \
                   functions/startup/test_startup.py \
                   functions/reserve/test_reserve_not_activated.py \
                   functions/meta/test_coverage_manifest.py \
                   functions/meta/test_zero_checks_law.py \
                   functions/opencode-adapter/test_opencode_adapter.py \
                   functions/verification-matrix/test_verification_matrix.py ; do
            [ -f "$f" ] || { echo "MISSING $f"; fail=1; continue; }

            out=$(python "$f" 2>&1); rc=$?
            # Числа берём из машинночитаемой строки закона, когда она есть, и
            # только иначе считаем строки вывода. «VERIFY-RESULT» - контракт,
            # `^pass` - проза, которую можно испортить правкой формулировки.
            ran=$(printf '%s\n' "$out" | sed -n 's/^VERIFY-RESULT.*passed_ran=\([0-9]*\).*/\1/p' | head -1)
            [ -n "$ran" ] || ran=$(printf '%s\n' "$out" | grep -c '^pass' || true)
            skipped=$(printf '%s\n' "$out" | grep -c '^SKIP' || true)
            # Факт прогона уходит ДАННЫМИ: сверка с манифестом читает этот файл.
            printf '%s\t%s\t%s\t%s\n' "$f" "$rc" "$ran" "$skipped" >> "$observed"

            declared=0
            case " $declared_skip " in *" $f "*) declared=1 ;; esac

            # Вердикт спрашивает закон (functions/meta/zero_checks_law.py), а не
            # решает этот шаг сам. Условие в shell было бы второй копией
            # правила, а вторая копия правила рано или поздно разъезжается с
            # первой - и разъехавшаяся молчит.
            v=$(printf '%s %s %s\n' "$rc" "$ran" "$declared" \
              | PYTHONPATH=functions/meta python functions/meta/zero_checks_law.py --verdict)
            vlabel=${v%% *}
            vwhy=${v#"$vlabel"}

            if [ "$vlabel" = "FAIL" ]; then
              echo "FAIL  $(printf '%-52s' "$f") rc=$rc, $ran ran: $vwhy"
              printf '%s\n' "$out" | grep -E '^(FAIL|ENV|Traceback)' | head -5
              echo "| \`$f\` | $rc | $ran | $skipped | **FAIL** |" >> "$summary"
              fail=1
            elif [ "$vlabel" = "SKIP" ]; then
              echo "SKIP  $(printf '%-52s' "$f") rc=$rc, $skipped groups skipped ($vwhy)"
              printf '%s\n' "$out" | grep -E '^SKIP|^VERIFY-RESULT' | head -3
              echo "| \`$f\` | $rc | 0 | $skipped | SKIP (declared) |" >> "$summary"
            else
              note=""
              [ "$skipped" -gt 0 ] && note=" ($skipped skipped)"
              echo "PASS  $(printf '%-52s' "$f") $ran groups$note"
              [ "$skipped" -gt 0 ] && printf '%s\n' "$out" | grep -A1 '^SKIP' | head -4
              echo "| \`$f\` | 0 | $ran | $skipped | pass$note |" >> "$summary"
            fi
          done

          echo
          {
            if [ "$fail" -eq 0 ]; then echo "**portable suites: passing**"
            else echo "**portable suites: FAILING**"; fi
          } >> "$summary"
          exit $fail

      - name: coverage reconciliation
        if: always()
        run: |
          set -uo pipefail
          # Список запуска можно сократить, и сам шаг этого не заметит: набор,
          # которого нет в списке, просто не выполняется, а сборка остаётся
          # зелёной. Проверено до правки: список из трёх наборов давал exit=0,
          # и тот же список без workerstate (41 группа) давал тот же exit=0.
          #
          # Сверка с манифестом требует, чтобы каждый объявленный набор
          # выполнил не меньше ожидаемого числа групп. Политика лежит в данных
          # (functions/meta/coverage-manifest.json), поэтому «подвинуть порог»
          # - это правка данных в git, а не безобидная правка константы в
          # этом файле. `if: always()` - сверка обязана отработать и тогда,
          # когда прогоны уже упали: иначе падение маскирует регресс покрытия.
          python functions/meta/test_coverage_manifest.py \
            --reconcile "${RUNNER_TEMP:-/tmp}/observed.tsv"